services:
  - type: web
    name: styleai-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: styleai-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://styleai.vercel.app"]'
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: styleai-db
    databaseName: styleai
    user: styleai
    plan: free
